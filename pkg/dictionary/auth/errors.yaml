errors:
  already_exists:
    code: EX
    http_status: 409
    en: Already exists.
    id: Sudah ada.
    zh: "已存在。"

  not_found:
    code: NF
    http_status: 404
    en: Data not found.
    id: Data tidak ditemukan.

  password_mismatch:
    code: PM
    http_status: 400
    en: Wrong password.
    id: Password salah.

  required:
    en: is required
    id: harus diisi
    zh: "必填"

  min_length:
    en: minimum length is %d
    id: minimal panjang karakter adalah %d
    zh: "最小长度为 %d"

  max_length:
    en: maximum length is %d
    id: maksimal panjang karakter adalah %d
    zh: "最大长度为 %d"

  alpha_only:
    en: must be alphabetical
    id: harus berupa huruf alfabet

  invalid_email:
    en: email is invalid
    id: email tidak valid
    zh: "邮箱格式无效"

  generate_token:
    code: GT
    http_status: 500
    en: Failed generating token.
    id: Gagal membuat token.
    
  auth_not_allowed:
    code: NA
    http_status: 403
    en: Feature not allowed for you.
    id: Fitur tidak diizinkan untuk anda.
