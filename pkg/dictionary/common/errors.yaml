errors:
  rate_limited:
    code: RL
    http_status: 429
    en: Too many requests. Try again later.
    id: Terlalu banyak permintaan. Coba lagi nanti.

  dependency_unavailable:
    code: DU
    http_status: 503
    en: Dependency unavailable.
    id: Layanan pendukung tidak tersedia.

  request_canceled:
    code: RC
    http_status: 499
    en: Request canceled.
    id: Permintaan dibatalkan.

  bad_request:
    code: BR
    http_status: 400
    en: Bad request.
    id: Permintaan tidak valid.

  not_found:
    code: NF
    http_status: 404
    en: Data not found.
    id: Data tidak ditemukan.

  endpoint_not_found:
    code: NF
    http_status: 404
    en: Endpoint not found.
    id: Endpoint tidak ditemukan.

  unauthorized:
    code: UA
    http_status: 401
    en: Unauthorized.
    id: Tidak terautentikasi.

  forbidden:
    code: FB
    http_status: 403
    en: Forbidden.
    id: Akses ditolak.

  service_unavailable:
    code: SU
    http_status: 503
    en: Service unavailable.
    id: Layanan tidak tersedia.

  deadline_exceeded:
    code: TO
    http_status: 504
    en: Request timeout.
    id: Waktu permintaan habis.

  internal_server_error:
    code: IS
    http_status: 500
    en: Internal server error.
    id: Terjadi kesalahan pada server.
