errors:
  version_conflict:
    code: VC
    http_status: 409
    en: User version has changed. Reload and retry.
    id: Versi pengguna telah berubah. Muat ulang dan coba kembali.

  resource_busy:
    code: RB
    http_status: 409
    en: Resource is busy. Retry the request.
    id: Resource sedang digunakan. Ulangi permintaan.

  idempotency_conflict:
    code: IC
    http_status: 409
    en: Idempotency key was already used with a different request.
    id: Kunci idempotensi sudah digunakan untuk permintaan yang berbeda.
