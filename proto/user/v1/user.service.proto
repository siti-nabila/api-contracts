syntax = "proto3";

package user.v1;

option go_package = "github.com/siti-nabila/api-contracts/pb/user/v1;userv1";

import "user/v1/user.payload.proto";
import "google/protobuf/empty.proto";

service UserService {
  rpc Register(AuthRequest) returns (UserTokenResponse);
  rpc Login(AuthRequest) returns (UserTokenResponse);
  rpc Me(google.protobuf.Empty) returns (UserData);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc TesRPC(google.protobuf.Empty) returns (TestRPC);
}
