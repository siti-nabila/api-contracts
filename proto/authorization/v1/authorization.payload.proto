syntax = "proto3";

package authorization.v1;

option go_package = "github.com/siti-nabila/api-contracts/pb/authorization/v1;authorizationv1";

import "google/protobuf/timestamp.proto";

enum AccessDecisionReason {
  ACCESS_DECISION_REASON_UNSPECIFIED = 0; // Never a valid server decision.
  ACCESS_DECISION_REASON_ALLOWED = 1;
  ACCESS_DECISION_REASON_PERMISSION_MISSING = 2;
  ACCESS_DECISION_REASON_APPLICATION_INACTIVE = 3;
  ACCESS_DECISION_REASON_APPLICATION_ACCESS_REQUIRED = 4;
}

message EvaluateAccessRequest {
  // Required after trimming; lowercase application code, maximum 50 characters.
  string application_code = 1;
  // Required exact code, maximum 150 characters; namespace must match application.
  // Resource may have multiple segments. Wildcards are not supported.
  string permission_code = 2;
}

// One primary-snapshot decision, never a cacheable or reusable access ticket.
// Invalid identity/session and dependency failures return gRPC errors instead.
message EvaluateAccessResponse {
  bool allowed = 1;
  AccessDecisionReason reason = 2;
  uint64 user_id = 3; // Always verified self.
  string sid = 4; // Verified session UUID; not an access or refresh credential.
  uint64 user_version = 5; // Entity version, not an authorization-policy revision.
  google.protobuf.Timestamp evaluated_at = 6;
}
