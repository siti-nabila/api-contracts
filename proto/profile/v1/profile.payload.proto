syntax = "proto3";

package profile.v1;

option go_package = "github.com/siti-nabila/api-contracts/pb/profile/v1;profilev1";

import "google/protobuf/field_mask.proto";

message Profile {
  uint64 id = 1;
  uint64 user_id = 2;
  string name = 3;
  string address = 4;
  string phone = 5;
  string country_code = 6; // Telephone calling code, for example +62.
}

message ProfileRequest {
  string name = 1;
  string address = 2;
  string phone = 3;
  // Absent: legacy full replacement. Present: only selected allowed fields.
  // Paths are name/address/phone/country_code; selected values follow validation.
  // Without a mask, an omitted country_code preserves its existing value.
  google.protobuf.FieldMask field_mask = 4;
  optional string country_code = 5; // Telephone calling code; presence is preserved.
}

message ProfileResponse {
  Profile profile = 1;
  uint64 version = 2; // User entity version, not auth_version.
  bool changed = 3;
}
