syntax = "proto3";

package permission.v1;

option go_package = "github.com/siti-nabila/api-contracts/pb/permission/v1;permissionv1";

import "permission/v1/permission.payload.proto";

// TLS, verified IAM/method-allowed service, ACTIVE unrestricted access/session
// and exact current iam.permission.read. One primary snapshot; shared read quota.
service PermissionService {
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
}
